# Netlify build & deploy config for the Chitra web app.
#
# This is a pnpm monorepo. The site lives at apps/web and depends on the
# four workspace packages under packages/. We build everything from the
# repo root so workspace links resolve correctly, then publish the static
# Vite output.

[build]
  # Run from the monorepo root so pnpm workspaces resolve.
  base    = "."
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "apps/web/dist"

[build.environment]
  # Match the engines field in package.json.
  NODE_VERSION = "20.11.1"
  # Pin the package manager Netlify auto-detects via packageManager field.
  PNPM_VERSION = "9.12.0"
  # Do NOT set NODE_ENV=production here — it makes pnpm skip
  # devDependencies, which removes typescript/vite/etc. from the install
  # and breaks the workspace package builds (`tsc: not found`). Vite sets
  # NODE_ENV=production internally for the actual bundling step.
  NPM_CONFIG_PRODUCTION = "false"
  # Suppress the optional husky/postinstall noise on CI.
  CI           = "true"

# SPA fallback: every unknown path serves index.html so React Router /
# in-app routes work on hard refresh and deep links.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# The Excalidraw lazy chunks ship from /excalidraw-assets/ — let the
# browser cache them aggressively (filenames are content-hashed).
[[headers]]
  for = "/excalidraw-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vite emits hashed asset filenames — same long-cache treatment.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always revalidate so a new deploy is picked up
# immediately (otherwise the PWA shell will serve stale chunks).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker also must not be cached so PWA updates roll out.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sensible default security headers for a static SPA.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
